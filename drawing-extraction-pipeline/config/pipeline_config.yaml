# Drawing Extraction Pipeline Configuration
# ------------------------------------------

pipeline:
  name: "drawing-extraction"
  version: "0.1.0"

# Input settings
input:
  supported_formats: ["pdf", "png", "jpg", "tiff"]
  default_dpi: 300          # DPI for rasterizing vector PDFs
  max_page_size_px: 10000   # Max dimension in pixels before downscaling

# Sheet segmentation
segmentation:
  method: "hybrid"          # "auto" | "manual" | "hybrid"
  auto_detection:
    min_box_area_ratio: 0.02  # Minimum box area as fraction of sheet
    line_detection_threshold: 50
    border_thickness_range: [1, 5]  # pixels at 300 DPI
  manual_fallback:
    enabled: true
    tool: "streamlit"       # UI for manual crop definition

# Text extraction
extraction:
  # Phase 1: Try PDF text layer first
  pdf_text_layer:
    enabled: true
    library: "pymupdf"      # pymupdf | pdfplumber | pdfminer
  # Phase 2: OCR for raster or missing text
  ocr:
    engine: "paddleocr"     # paddleocr | easyocr | tesseract | cloud_vision
    rotation_detection: true
    confidence_threshold: 0.6
    languages: ["en"]
  # Phase 3: Vision LLM for complex/ambiguous regions
  vision_llm:
    enabled: true
    model: "claude-sonnet-4-5-20250929"
    use_for: ["ambiguous_text", "field_mapping", "dimension_association"]
    max_tokens_per_crop: 4096

# Dimension/leader association
association:
  method: "hybrid"          # "heuristic" | "ml" | "vision_llm" | "hybrid"
  heuristic:
    proximity_threshold_px: 50    # Max distance text↔line endpoint
    dimension_line_patterns:
      - "double_arrow"     # ←————→  with text above/below
      - "leader_arrow"     # ——→ text
      - "callout_bubble"   # circle/diamond with text + leader
  vision_llm_verification: true

# Template-based extraction
template:
  enabled: true
  # Define field schema from first object, apply to rest
  template_object_id: null  # Set after first object is processed
  field_schema: null        # Loaded from schemas/extraction_schema.json
  similarity_threshold: 0.8 # How similar objects must be to use template

# Export settings
export:
  formats: ["csv", "json"]  # csv | json | sqlite
  csv:
    delimiter: ","
    include_confidence: true
    include_coordinates: false  # Keep CSV clean; coords in JSON
  json:
    schema: "schemas/extraction_schema.json"
    pretty_print: true
  sqlite:
    enabled: false
    db_path: "output/extraction.db"

# QA overlay generation
overlay:
  enabled: true
  output_format: "pdf"      # "pdf" | "png" | "both"
  annotations:
    circle_radius: 15
    circle_color: [255, 0, 0]       # Red
    circle_alpha: 0.6
    label_font_size: 8
    label_format: "{object_id}.{field} = {value} (conf={confidence:.2f})"
    high_confidence_color: [0, 180, 0]   # Green for conf > 0.9
    medium_confidence_color: [255, 165, 0] # Orange for 0.7-0.9
    low_confidence_color: [255, 0, 0]     # Red for conf < 0.7
  batch:
    parallel_workers: 4

# Directory structure
paths:
  input_dir: "samples/"
  output_dir: "output/"
  crops_dir: "output/crops/"
  tables_dir: "output/tables/"
  overlays_dir: "output/overlays/"
  templates_dir: "config/templates/"
